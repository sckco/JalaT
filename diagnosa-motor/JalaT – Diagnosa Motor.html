<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JalaT – Gejala moTor, terjaring jelas</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#16181b;--panel:#1f2226;--panel2:#2b2f35;--yel:#ffc400;--org:#ff7a1a;--red:#e5392f;--grn:#3ddc84;
  --tx:#f1efe8;--mut:#a9a69b;--paper:#f4efe0;--ink:#1d1b16;--ink2:#6b6554;
  --glass:rgba(31,34,38,.52);--gedge:rgba(255,196,0,.35);--line:rgba(255,255,255,.1);
  --plate:rgba(255,255,255,.035);--oil:rgba(255,122,26,.12);
  --cond:"Arial Narrow","Roboto Condensed",Impact,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Courier New",monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#d9d7d0;--panel:#efede6;--panel2:#e2dfd5;--tx:#1d1b16;--mut:#5f5b4e;
    --glass:rgba(250,248,240,.55);--gedge:rgba(160,110,0,.45);--line:rgba(0,0,0,.14);--plate:rgba(0,0,0,.04);--oil:rgba(255,122,26,.16)}
}
:root[data-theme="dark"]{--bg:#16181b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);overflow-x:hidden;
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
   radial-gradient(40vmax 28vmax at 85% 12%,var(--oil),transparent 70%),
   radial-gradient(36vmax 30vmax at 5% 70%,var(--oil),transparent 70%),
   repeating-linear-gradient(45deg,var(--plate) 0 2px,transparent 2px 14px),
   repeating-linear-gradient(-45deg,var(--plate) 0 2px,transparent 2px 14px),var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:26px 16px 150px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--gedge);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 30px rgba(0,0,0,.35)}

/* Header */
.hero{position:relative;margin-bottom:22px}
.band{position:absolute;left:-6%;right:-6%;top:46%;height:44px;transform:rotate(-2.5deg);
  background:repeating-linear-gradient(-45deg,var(--yel) 0 18px,#111 18px 36px);background-size:51px 51px;animation:haz 1.6s linear infinite;opacity:.95}
@keyframes haz{to{background-position:51px 0}}
header{position:relative;border-radius:14px;padding:22px 20px 18px;animation:drop .8s .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-26px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.rv{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e8e8e8,#555 70%);box-shadow:0 1px 2px #000}
.rv:nth-child(1){top:8px;left:8px}.rv:nth-child(2){top:8px;right:8px}.rv:nth-child(3){bottom:8px;left:8px}.rv:nth-child(4){bottom:8px;right:8px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:44px;height:44px;flex:none;color:var(--yel);animation:wob 4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes wob{50%{transform:rotate(14deg)}}
h1{margin:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:clamp(38px,10vw,56px);line-height:.95;font-weight:900}
h1 b{color:var(--yel);text-shadow:0 0 18px rgba(255,196,0,.5)}
.tag{margin:8px 0 0;color:var(--mut);font-size:14.5px}
.lamps{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lp{display:flex;align-items:center;gap:6px;font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--mut)}
.lp i{width:12px;height:12px;border-radius:50%;background:#444;box-shadow:inset 0 1px 2px #000;animation:boot 1.2s calc(var(--k)*.14s) both}
@keyframes boot{0%{background:#444;box-shadow:none}25%,55%{background:var(--c);box-shadow:0 0 12px var(--c)}100%{background:#444;box-shadow:inset 0 1px 2px #000}}
.odo{margin-left:auto;display:flex;align-items:center;gap:6px;font:700 11px var(--mono);color:var(--mut);letter-spacing:.06em}
.odo span{display:inline-block;background:#0c0d0f;color:var(--yel);padding:4px 8px;border-radius:5px;font-size:20px;border:1px solid #000;box-shadow:inset 0 2px 5px #000;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.odo span.bump{transform:translateY(-4px) scale(1.15)}

h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:19px;margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--yel) 0 14px,transparent 14px 26px);opacity:.7}

/* Checklist */
.list{display:grid;gap:9px}
.sym{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:transform .15s,background .25s;animation:tin .6s calc(var(--n)*60ms + 1.1s) cubic-bezier(.2,1,.3,1.1) both}
@keyframes tin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.sym::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:var(--yel);transform:scaleY(0);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sym.on{background:var(--panel2)}.sym.on::before{transform:scaleY(1)}
.sym:active{transform:translateY(2px)}
.sym input{position:absolute;opacity:0;pointer-events:none}
.sym:focus-within{outline:3px solid var(--yel);outline-offset:2px}
.cd{font:800 14px var(--mono);color:var(--yel);width:38px;flex:none}
.lb{flex:1;font-size:15.5px;line-height:1.35}.lb small{display:block;color:var(--mut);font:12px var(--mono);margin-top:2px}
.st{font:800 11px var(--mono);letter-spacing:.08em;color:var(--mut);width:34px;text-align:right}
.sym.on .st{color:var(--org)}
.lamp{width:16px;height:16px;border-radius:50%;background:#3a3d42;box-shadow:inset 0 2px 3px #000;transition:background .25s,box-shadow .25s;flex:none}
.sym.on .lamp{background:var(--org);box-shadow:0 0 14px var(--org),0 0 4px #fff inset}
.bolt{width:30px;height:30px;flex:none;color:#8d9096;transition:transform .5s cubic-bezier(.3,1.6,.5,1),color .3s}
.sym.on .bolt{transform:rotate(180deg);color:var(--yel)}

/* Dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 24px),540px);display:flex;gap:10px;padding:10px;border-radius:16px;z-index:5;animation:dk 1s 1.4s cubic-bezier(.2,1,.3,1.15) both}
@keyframes dk{from{opacity:0;transform:translate(-50%,80px)}to{opacity:1;transform:translate(-50%,0)}}
button{font:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn{height:52px;border-radius:10px;font:900 17px var(--cond);letter-spacing:.1em;text-transform:uppercase;transition:transform .1s,box-shadow .1s}
.go{flex:1.6;background:var(--yel);color:#17140a;box-shadow:0 5px 0 #a87f00,0 8px 14px rgba(0,0,0,.4)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a87f00}
.rs{flex:1;background:linear-gradient(#aeb2b8,#7d8187);color:#14161a;box-shadow:0 5px 0 #4a4d52,0 8px 14px rgba(0,0,0,.4)}
.rs:active{transform:translateY(4px);box-shadow:0 1px 0 #4a4d52}

/* Nota hasil */
#results{display:grid;gap:26px}
.nota{position:relative;background:var(--paper);color:var(--ink);padding:18px 18px 20px;border-radius:4px 4px 0 0;font-size:14.5px;box-shadow:0 10px 24px rgba(0,0,0,.4);
  animation:print .8s calc(var(--i)*140ms) cubic-bezier(.2,1,.3,1.05) both}
@keyframes print{from{opacity:0;transform:translateY(-40px) rotate(-1.6deg)}to{opacity:1;transform:none}}
.nota::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:conic-gradient(from -45deg at bottom,var(--paper) 90deg,#0000 0) 0 0/14px 10px}
.nh{display:flex;justify-content:space-between;font:700 12px var(--mono);color:var(--ink2);padding-bottom:8px;border-bottom:2px dashed #b9b29a}
.nn{font:900 24px var(--cond);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px;line-height:1.05;padding-right:90px}
.stamp{position:absolute;right:12px;top:42px;transform:rotate(11deg);border:3px solid var(--red);color:var(--red);font:900 13px var(--cond);letter-spacing:.12em;padding:4px 8px;border-radius:5px;text-transform:uppercase;animation:stp .5s 1.3s cubic-bezier(.2,2,.4,1) both;text-align:center;line-height:1.1}
@keyframes stp{from{opacity:0;transform:rotate(11deg) scale(2.6)}to{opacity:.9;transform:rotate(11deg) scale(1)}}
.gauge{display:block;width:min(260px,100%);margin:6px auto 0}
.gauge .tr{stroke:#cfc8b2}.gauge .fl{stroke:var(--gc);stroke-dashoffset:100;animation:garc 1.5s calc(var(--i)*140ms + .5s) cubic-bezier(.2,.9,.3,1) forwards}
@keyframes garc{to{stroke-dashoffset:calc(100 - var(--p))}}
.nd{transform-origin:100px 100px;transform:rotate(-90deg);animation:rev 1.6s calc(var(--i)*140ms + .5s) cubic-bezier(.3,1.2,.4,1) forwards}
@keyframes rev{0%{transform:rotate(-90deg)}40%{transform:rotate(95deg)}100%{transform:rotate(var(--a))}}
.gv{font:900 36px var(--cond);text-anchor:middle;fill:var(--ink)}
.fuel{display:flex;gap:4px;margin:12px 0 6px}
.fuel i{flex:1;height:18px;border-radius:3px;background:#d8d1ba;border:1px solid #b9b29a;opacity:1}
.fuel i.f{background:var(--gc);border-color:rgba(0,0,0,.25);animation:seg .35s calc(var(--s)*70ms + var(--i)*140ms + .5s) both}
@keyframes seg{from{background:#d8d1ba;transform:scaleY(.4)}}
.pcs{display:flex;justify-content:space-between;align-items:baseline;font:700 13px var(--mono);color:var(--ink2)}
.pcs b{font:900 28px var(--cond);color:var(--ink)}
.meta{font:12.5px var(--mono);color:var(--ink2);margin-top:4px;text-align:center}
.sol{margin:12px 0 0;line-height:1.5;padding-top:10px;border-top:2px dashed #b9b29a}
.tg{margin-top:12px;height:42px;padding:0 16px;border-radius:6px;background:var(--ink);color:var(--paper);font:800 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.drw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.9,.3,1)}
.drw.open{grid-template-rows:1fr}.drw>div{overflow:hidden}
.tbw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono);min-width:420px}
th,td{padding:6px 5px;text-align:left;border-bottom:1px dashed #b9b29a}th{color:var(--ink2)}
.y{color:#0b7a3b;font-weight:800}.n{color:#9a947f}
.fm{margin-top:10px;padding:10px;background:#e6dfc7;font:700 13px var(--mono);border-left:5px solid var(--yel)}

/* Toast check engine */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14.5px;max-width:calc(100% - 24px);border-color:rgba(229,57,47,.6);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:28px;height:28px;color:var(--red);flex:none}
.toast.show svg{animation:blk .3s 3 alternate}
@keyframes blk{from{opacity:1;filter:drop-shadow(0 0 8px var(--red))}to{opacity:.15}}
.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="toast glass" id="toast" role="alert">
  <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M3 12h3V9h4V7h6v2h3l2 3h4v4h-3v5H14l-3-3H7v-3H3z"/></svg>
  <span id="tmsg"></span>
</div>

<main class="wrap">
  <div class="hero">
    <div class="band" aria-hidden="true"></div>
    <header class="glass">
      <i class="rv"></i><i class="rv"></i><i class="rv"></i><i class="rv"></i>
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 6a10 10 0 0 0-8 14L7 35a4 4 0 0 0 6 6l15-15a10 10 0 0 0 14-8l-6 4-5-1-1-5z"/></svg>
        <h1>Jala<b>T</b></h1>
      </div>
      <p class="tag">JalaT: Gejala moTor, terjaring jelas.</p>
      <div class="lamps">
        <span class="lp" style="--k:0;--c:#e5392f"><i></i>OLI</span>
        <span class="lp" style="--k:1;--c:#ffc400"><i></i>AKI</span>
        <span class="lp" style="--k:2;--c:#ff7a1a"><i></i>MESIN</span>
        <span class="lp" style="--k:3;--c:#3ddc84"><i></i>SIAP</span>
        <span class="odo">GEJALA <span id="count">00</span> /10</span>
      </div>
    </header>
  </div>

  <h2>Centang gejalanya</h2>
  <div class="list" id="symptoms"></div>

  <section id="resSec" hidden>
    <h2>Nota diagnosa</h2>
    <div id="results"></div>
  </section>
</main>

<nav class="dock glass" aria-label="Aksi">
  <button class="btn rs" id="reset" type="button">Kosongkan</button>
  <button class="btn go" id="run" type="button">Cek Sekarang</button>
</nav>

<script>
const SYMPTOMS=[
 {code:"G01",label:"Tenaga motor loyo, tarikan terasa berat",weight:0.7},
 {code:"G02",label:"Mesin sulit dihidupkan",weight:0.8},
 {code:"G03",label:"Mesin brebet atau busi sering basah",weight:0.6},
 {code:"G04",label:"Lampu redup, aki cepat habis",weight:0.5},
 {code:"G05",label:"Knalpot mengeluarkan asap putih atau hitam",weight:0.7},
 {code:"G06",label:"Bunyi kasar atau berdecit dari area CVT",weight:0.8},
 {code:"G07",label:"Mesin cepat panas (overheat)",weight:0.8},
 {code:"G08",label:"Bahan bakar boros",weight:0.5},
 {code:"G09",label:"Getaran atau hentakan saat gas awal",weight:0.7},
 {code:"G10",label:"Oli cepat berkurang atau ada rembesan",weight:0.6}
];
const CASES=[
 {code:"K01",name:"Sistem Pengapian",symptoms:["G02","G03","G08"],solution:"Periksa busi, koil, dan CDI. Bersihkan atau ganti busi, lalu cek tegangan koil."},
 {code:"K02",name:"Sistem Bahan Bakar",symptoms:["G01","G02","G03","G08"],solution:"Cek filter bensin, pompa bahan bakar, dan injektor atau karburator. Bersihkan saluran yang tersumbat."},
 {code:"K03",name:"Sistem Kelistrikan / Aki",symptoms:["G02","G04"],solution:"Ukur tegangan aki dan cek kiprok serta spul. Ganti aki bila tegangan tidak stabil."},
 {code:"K04",name:"Sistem Pendinginan / Pelumasan",symptoms:["G05","G07","G10"],solution:"Periksa level oli dan cairan pendingin, cek seal, dan ganti oli sesuai jadwal."},
 {code:"K05",name:"Sistem CVT / Transmisi",symptoms:["G01","G06","G09"],solution:"Bongkar dan bersihkan CVT. Periksa V-belt, roller, kampas ganda, dan pulley."}
];
const W=Object.fromEntries(SYMPTOMS.map(s=>[s.code,s.weight]));
const L=Object.fromEntries(SYMPTOMS.map(s=>[s.code,s.label]));
const $=id=>document.getElementById(id);
const selected=new Set();

// Nearest Neighbor: bobot cocok ÷ bobot gabungan (input ∪ kasus)
function diagnose(input){
  return CASES.map(c=>{
    const union=[...new Set([...input,...c.symptoms])];
    const matched=union.filter(k=>input.has(k)&&c.symptoms.includes(k));
    const total=union.reduce((a,k)=>a+W[k],0);
    const num=matched.reduce((a,k)=>a+W[k],0);
    const similarity=total>0?num/total:0;
    return {caseCode:c.code,caseName:c.name,similarity,percentage:similarity*100,
      matchedCount:matched.length,totalCompared:union.length,solution:c.solution,union,num,total,cs:c.symptoms};
  }).sort((a,b)=>b.similarity-a.similarity||b.matchedCount-a.matchedCount||a.caseCode.localeCompare(b.caseCode));
}

const BOLT='<svg class="bolt" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M16 2l11 6.5v13L16 28 5 21.5v-13z"/><circle cx="16" cy="15" r="4.5"/></svg>';
$("symptoms").innerHTML=SYMPTOMS.map((s,i)=>`
 <label class="sym" style="--n:${i}">
  <input type="checkbox" value="${s.code}">
  <span class="cd">${s.code}</span>
  <span class="lb">${s.label}<small>bobot ${s.weight}</small></span>
  <span class="st">OFF</span><span class="lamp"></span>${BOLT}
 </label>`).join("");

const cnt=$("count");
document.querySelectorAll(".sym input").forEach(inp=>inp.addEventListener("change",()=>{
  const row=inp.closest(".sym");
  inp.checked?selected.add(inp.value):selected.delete(inp.value);
  row.classList.toggle("on",inp.checked);
  row.querySelector(".st").textContent=inp.checked?"AKTIF":"OFF";
  cnt.textContent=String(selected.size).padStart(2,"0");
  cnt.classList.add("bump");setTimeout(()=>cnt.classList.remove("bump"),250);
}));

let tt;
function toast(m){const t=$("toast");$("tmsg").textContent=m;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800)}
const f2=n=>n.toFixed(2);
const col=p=>p<40?"var(--red)":p<70?"#e0a400":"#1fa75a";

function gauge(r,i){
  const p=r.percentage;
  return `<svg class="gauge" viewBox="0 0 200 124" role="img" aria-label="Kemiripan ${p.toFixed(1)} persen" style="--gc:${col(p)};--i:${i};--p:${p};--a:${p*1.8-90}deg">
   <path class="tr" d="M20 100A80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100"/>
   <path class="fl" d="M20 100A80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/>
   <g class="nd"><path d="M100 100L96 100L100 30L104 100Z" fill="#1d1b16"/></g>
   <circle cx="100" cy="100" r="9" fill="#1d1b16"/><circle cx="100" cy="100" r="3" fill="var(--yel)"/>
   <text class="gv" x="100" y="122">${p.toFixed(1)}%</text></svg>`;
}
function fuel(r,i){
  const n=Math.round(r.percentage/10);
  return `<div class="fuel" style="--gc:${col(r.percentage)};--i:${i}" role="img" aria-label="Kemiripan ${r.percentage.toFixed(1)} persen">${
    Array.from({length:10},(_,k)=>`<i class="${k<n?"f":""}" style="--s:${k}"></i>`).join("")}</div>
   <div class="pcs"><span>KEMIRIPAN</span><b>${r.percentage.toFixed(1)}%</b></div>`;
}

function render(res){
  $("resSec").hidden=false;
  $("results").innerHTML=res.map((r,i)=>`
  <article class="nota" style="--i:${i}">
    <div class="nh"><span>SPK-${r.caseCode}</span><span>PERINGKAT ${i+1}</span></div>
    ${i===0?'<div class="stamp">Prioritas<br>cek</div>':""}
    <div class="nn">${r.caseName}</div>
    ${i===0?gauge(r,i):fuel(r,i)}
    <div class="meta">${r.matchedCount} cocok dari ${r.totalCompared} gejala · skor ${f2(r.similarity)}</div>
    <p class="sol"><b>Saran awal:</b> ${r.solution}</p>
    <button class="tg" type="button" aria-expanded="false">Buka rincian ▾</button>
    <div class="drw"><div>
      <div class="tbw"><table><tr><th>Gejala</th><th>Bobot</th><th>Input</th><th>Kasus</th></tr>
      ${r.union.map(k=>`<tr><td>${k} ${L[k]}</td><td>${W[k]}</td>
       <td class="${selected.has(k)?"y":"n"}">${selected.has(k)?"YA":"-"}</td>
       <td class="${r.cs.includes(k)?"y":"n"}">${r.cs.includes(k)?"YA":"-"}</td></tr>`).join("")}</table></div>
      <div class="fm">Similarity = ${f2(r.num)} ÷ ${f2(r.total)} = ${f2(r.similarity)}</div>
    </div></div>
  </article>`).join("");
  document.querySelectorAll(".tg").forEach(b=>b.addEventListener("click",()=>{
    const o=b.nextElementSibling.classList.toggle("open");
    b.setAttribute("aria-expanded",o);b.textContent=o?"Tutup rincian ▴":"Buka rincian ▾";
  }));
  setTimeout(()=>$("resSec").scrollIntoView({behavior:"smooth",block:"start"}),60);
}

$("run").addEventListener("click",()=>{
  if(!selected.size){
    toast("Pilih dulu minimal satu gejala, Bos.");
    const l=$("symptoms");l.classList.remove("shake");void l.offsetWidth;l.classList.add("shake");return;
  }
  render(diagnose(selected));
});
$("reset").addEventListener("click",()=>{
  selected.clear();
  document.querySelectorAll(".sym").forEach(r=>{r.classList.remove("on");r.querySelector("input").checked=false;r.querySelector(".st").textContent="OFF"});
  cnt.textContent="00";$("results").innerHTML="";$("resSec").hidden=true;
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
